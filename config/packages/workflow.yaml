framework:
    workflows:
        validation_compte:
            type: 'state_machine'
            audit_trail:
              enabled: true
            marking_store:
              type: 'method'
              property: 'status'
            supports:
                - App\Entity\Professionnel
            initial_marking: attente
            places:
                - attente
                - rejete
                - accepte
                - valide
                - refuse
                - renouvellement
                - a_jour
            transitions:
                acceptation:
                    from: attente
                    to: accepte
                rejet:
                    from: attente
                    to: rejete
                refuse:
                    from: accepte
                    to: refuse
                validation:
                    from: accepte 
                    to: valide
                renouvellement:
                    from: valide
                    to: renouvellement
                mis_a_jour:
                    from: renouvellement 
                    to: a_jour

        validation_etablissement:
            type: 'state_machine'
            audit_trail:
                enabled: true
            marking_store:
                type: 'method'
                property: 'status'
            supports:
                - App\Entity\Etablissement
            initial_marking: attente
            places:
                - attente
                - accepte
                - valide
                - refuse
                - renouvellement
                - a_jour
            transitions:
                acceptation:
                    from: attente
                    to: accepte
                    guard: "is_granted('ROLE_ADMIN')"
                rejet:
                    from: attente
                    to: refuse
                    guard: "is_granted('ROLE_ADMIN')"
                validation:
                    from: accepte
                    to: valide
                    guard: "is_granted('ROLE_VALIDATEUR')"
                renouvellement:
                    from: valide
                    to: renouvellement
                    guard: "is_granted('ROLE_ETABLISSEMENT')"
                mis_a_jour:
                    from: renouvellement
                    to: a_jour
                    guard: "is_granted('ROLE_ADMIN') or is_granted('ROLE_VALIDATEUR')"